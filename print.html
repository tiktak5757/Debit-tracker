<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Print Sales</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,sans-serif;background:#f5f5f5;color:#000;padding:16px;}
h1{font-size:1.3rem;font-weight:900;margin-bottom:4px;}
.sub{color:#666;font-size:.85rem;margin-bottom:16px;}
.btn{width:100%;padding:14px;border:none;border-radius:8px;font-size:1rem;font-weight:900;cursor:pointer;margin-bottom:10px;display:block;}
.btn-print{background:#000;color:#fff;}
.btn-back{background:#eee;color:#000;}
.entry{background:#fff;border:2px solid #ddd;border-radius:10px;padding:12px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;}
.entry input{width:24px;height:24px;accent-color:#000;flex-shrink:0;cursor:pointer;}
.entry-name{font-weight:900;font-size:.95rem;}
.entry-info{font-size:.8rem;color:#666;margin-top:2px;}
#loading{text-align:center;padding:40px;font-size:1.1rem;color:#666;}
#preview{display:none;background:#fff;padding:16px;border-radius:10px;margin-top:16px;}
#picker{display:block;}
table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:16px;}
th{background:#f0f0f0;border:1px solid #ccc;padding:5px;text-align:left;}
td{border:1px solid #ddd;padding:5px;}
.tot{background:#f9f9f9;font-weight:900;}
.green{color:green;font-weight:700;}
.red{color:red;font-weight:700;}
.section-title{font-size:14px;font-weight:900;border-bottom:2px solid #000;padding-bottom:3px;margin:12px 0 6px;}
.entry-header{text-align:center;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:12px;}
.entry-header h2{font-size:18px;font-weight:900;}
.entry-header p{font-size:13px;color:#333;margin-top:4px;}
.divider{border-top:3px solid #000;margin:20px 0;}
@media print{
  .btn,.sub,#picker{display:none!important;}
  #preview{display:block!important;border:none;padding:0;}
  body{padding:10px;background:#fff;}
}
</style>
</head>
<body>
<h1>🖨 Print Sales</h1>
<p class="sub">Tick the entries you want to print then tap Generate</p>

<div id="loading">Loading entries...</div>

<div id="picker" style="display:none;">
  <div id="entryList"></div>
  <button class="btn btn-print" id="generateBtn">📋 GENERATE REPORT</button>
</div>

<div id="preview">
  <button class="btn btn-print" onclick="window.print()">🖨 PRINT / SAVE AS PDF</button>
  <button class="btn btn-back" onclick="document.getElementById('preview').style.display='none';document.getElementById('picker').style.display='block';">← BACK TO SELECTION</button>
  <div id="previewContent"></div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import{getFirestore,collection,getDocs}from"https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const app=initializeApp({apiKey:"AIzaSyC2MNnPbvPMSMexHHECRUPqHDdMCCHgMKw",authDomain:"fresh-debt-tracker.firebaseapp.com",projectId:"fresh-debt-tracker"});
const db=getFirestore(app);

function fmt(n){return'£'+(parseFloat(n)||0).toFixed(2);}
function fmtD(d){if(!d)return'';try{const p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0];}catch(e){return d;}}
function salePaid(sl){return(sl.payments||[]).reduce((s,p)=>s+(parseFloat(p.amt)||0),0)+(parseFloat(sl.paidNow)||0);}
function saleOwed(sl){return Math.max(0,(parseFloat(sl.price)||0)-salePaid(sl));}

let allItems=[];

try{
  const snap=await getDocs(collection(db,'fresh'));
  allItems=snap.docs.map(d=>d.data()).sort((a,b)=>(b.dt||'').localeCompare(a.dt||''));
  
  const list=document.getElementById('entryList');
  list.innerHTML=allItems.map((item,i)=>{
    const sales=(item.sales||[]).filter(s=>s.saleType!=='booking');
    const paid=sales.reduce((s,sl)=>s+salePaid(sl),0);
    const owed=sales.reduce((s,sl)=>s+saleOwed(sl),0);
    const label=(item.name?item.name+' - ':'')+item.type+' - '+fmtD(item.dt);
    return `<label class="entry">
      <input type="checkbox" data-idx="${i}">
      <div>
        <div class="entry-name">${label}</div>
        <div class="entry-info">${sales.length} sales &nbsp;|&nbsp; Collected: ${fmt(paid)} &nbsp;|&nbsp; Owed: ${fmt(owed)}</div>
      </div>
    </label>`;
  }).join('');

  document.getElementById('loading').style.display='none';
  document.getElementById('picker').style.display='block';

  document.getElementById('generateBtn').addEventListener('click',function(){
    const checked=document.querySelectorAll('#entryList input:checked');
    if(!checked.length){alert('Please tick at least one entry.');return;}
    
    let html='';
    let n=0;
    checked.forEach(cb=>{
      const item=allItems[parseInt(cb.dataset.idx)];
      if(!item)return;
      const sales=(item.sales||[]).filter(s=>s.saleType!=='booking').sort((a,b)=>(b.dt||'').localeCompare(a.dt||''));
      const label=(item.name?item.name+' - ':'')+item.type+' - '+fmtD(item.dt);
      const tp=sales.reduce((s,sl)=>s+salePaid(sl),0);
      const to=sales.reduce((s,sl)=>s+saleOwed(sl),0);
      if(n>0)html+='<div class="divider"></div>';
      html+=`<div class="entry-header"><h2>${label}</h2><p><b>Sales:</b> ${sales.length} &nbsp; <b>Collected:</b> ${fmt(tp)} &nbsp; <b>Owed:</b> ${fmt(to)}</p></div>`;
      if(!sales.length){html+='<p style="text-align:center;color:#666;padding:10px;">No sales recorded.</p>';n++;return;}
      const types=[...new Set(sales.map(s=>s.type||'Unknown'))];
      types.forEach(type=>{
        const ts=sales.filter(s=>(s.type||'Unknown')===type);
        const tP=ts.reduce((s,sl)=>s+parseFloat(sl.price||0),0);
        const tPd=ts.reduce((s,sl)=>s+salePaid(sl),0);
        const tO=ts.reduce((s,sl)=>s+saleOwed(sl),0);
        html+=`<div class="section-title">${type.toUpperCase()} — ${ts.length} SALES</div>`;
        html+='<table><thead><tr><th>Date</th><th>Name</th><th>Size</th><th>Qty</th><th>Price</th><th>Paid</th><th>Owed</th></tr></thead><tbody>';
        ts.forEach(sl=>{
          const ow=saleOwed(sl);
          html+=`<tr><td>${fmtD(sl.dt)}</td><td><b>${sl.buyer||''}</b></td><td style="text-align:center">${sl.size||'-'}</td><td style="text-align:right">${sl.qty||1}</td><td style="text-align:right">${fmt(sl.price||0)}</td><td class="green" style="text-align:right">${fmt(salePaid(sl))}</td><td class="${ow>0?'red':'green'}" style="text-align:right">${fmt(ow)}</td></tr>`;
        });
        html+=`<tr class="tot"><td colspan="4">TOTAL</td><td style="text-align:right">${fmt(tP)}</td><td class="green" style="text-align:right">${fmt(tPd)}</td><td class="${tO>0?'red':'green'}" style="text-align:right">${fmt(tO)}</td></tr></tbody></table>`;
      });
      n++;
    });
    
    document.getElementById('previewContent').innerHTML=html;
    document.getElementById('picker').style.display='none';
    document.getElementById('preview').style.display='block';
    window.scrollTo(0,0);
  });
}catch(e){
  document.getElementById('loading').textContent='Error: '+e.message;
}
</script>
</body>
</html>
