<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Print Sales</title>
<style>
body{font-family:Arial,sans-serif;margin:20px;background:#fff;color:#000;}
.btn{width:100%;padding:14px;border:none;border-radius:8px;font-size:1rem;font-weight:900;cursor:pointer;margin-bottom:10px;}
.btn-close{background:#eee;color:#000;}
.btn-print{background:#000;color:#fff;}
h2{font-size:18px;font-weight:900;text-align:center;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:4px;}
.summary{text-align:center;font-size:13px;margin-bottom:16px;}
h3{font-size:14px;font-weight:900;border-bottom:2px solid #000;padding-bottom:3px;margin:12px 0 6px;}
table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:16px;}
th{background:#f0f0f0;border:1px solid #ccc;padding:5px;text-align:left;}
td{border:1px solid #ddd;padding:5px;}
.tot{background:#f9f9f9;font-weight:900;}
.green{color:green;font-weight:700;}
.red{color:red;font-weight:700;}
#loading{text-align:center;padding:40px;font-size:1.2rem;}
@media print{.btn{display:none!important;}}
</style>
</head>
<body>
<button class="btn btn-close" onclick="window.close()">✕ CLOSE</button>
<button class="btn btn-print" onclick="window.print()">🖨 PRINT / SAVE AS PDF</button>
<div id="loading">Loading sales data...</div>
<div id="content"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import{getFirestore,doc,getDoc}from"https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const app=initializeApp({apiKey:"AIzaSyC2MNnPbvPMSMexHHECRUPqHDdMCCHgMKw",authDomain:"fresh-debt-tracker.firebaseapp.com",projectId:"fresh-debt-tracker"});
const db=getFirestore(app);

const params=new URLSearchParams(window.location.search);
const id=params.get('id');

function fmt(n){return'£'+(parseFloat(n)||0).toFixed(2);}
function fmtD(d){if(!d)return'';try{const p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0];}catch(e){return d;}}
function salePaid(sl){return(sl.payments||[]).reduce((s,p)=>s+(parseFloat(p.amt)||0),0)+(parseFloat(sl.paidNow)||0);}
function saleOwed(sl){return Math.max(0,(parseFloat(sl.price)||0)-salePaid(sl));}

if(!id){document.getElementById('loading').textContent='No entry ID provided.';} 
else {
  try{
    const snap=await getDoc(doc(db,'fresh',id));
    if(!snap.exists()){document.getElementById('loading').textContent='Entry not found.';}
    else{
      const item=snap.data();
      const sales=(item.sales||[]).filter(s=>s.saleType!=='booking').sort((a,b)=>b.dt.localeCompare(a.dt));
      const label=(item.name?item.name+' - ':'')+item.type+' - '+fmtD(item.dt);
      const tp=sales.reduce((s,sl)=>s+salePaid(sl),0);
      const to=sales.reduce((s,sl)=>s+saleOwed(sl),0);
      let html='<h2>'+label+'</h2>';
      html+='<div class="summary"><b>Sales:</b> '+sales.length+' &nbsp; <b>Collected:</b> '+fmt(tp)+' &nbsp; <b>Owed:</b> '+fmt(to)+'</div>';
      const types=[...new Set(sales.map(s=>s.type))];
      types.forEach(type=>{
        const ts=sales.filter(s=>s.type===type);
        const tP=ts.reduce((s,sl)=>s+parseFloat(sl.price||0),0);
        const tPd=ts.reduce((s,sl)=>s+salePaid(sl),0);
        const tO=ts.reduce((s,sl)=>s+saleOwed(sl),0);
        html+='<h3>'+(type||'Unknown').toUpperCase()+' — '+ts.length+' SALES</h3>';
        html+='<table><thead><tr><th>Date</th><th>Name</th><th>Size</th><th>Qty</th><th>Price</th><th>Paid</th><th>Owed</th></tr></thead><tbody>';
        ts.forEach(sl=>{
          const ow=saleOwed(sl);
          html+='<tr><td>'+fmtD(sl.dt)+'</td><td><b>'+sl.buyer+'</b></td><td style="text-align:center">'+(sl.size||'-')+'</td><td style="text-align:right">'+sl.qty+'</td><td style="text-align:right">'+fmt(sl.price||0)+'</td><td class="green" style="text-align:right">'+fmt(salePaid(sl))+'</td><td class="'+(ow>0?'red':'green')+'" style="text-align:right">'+fmt(ow)+'</td></tr>';
        });
        html+='<tr class="tot"><td colspan="4">TOTAL</td><td style="text-align:right">'+fmt(tP)+'</td><td class="green" style="text-align:right">'+fmt(tPd)+'</td><td class="'+(tO>0?'red':'green')+'" style="text-align:right">'+fmt(tO)+'</td></tr></tbody></table>';
      });
      document.getElementById('loading').style.display='none';
      document.getElementById('content').innerHTML=html;
    }
  }catch(e){document.getElementById('loading').textContent='Error: '+e.message;}
}
</script>
</body>
</html>
